<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COVER FLICK 스톤월 진열</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Inter", "Noto Sans KR", system-ui, sans-serif; color: #f4f2f7; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .brand { position: fixed; top: 28px; left: 36px; z-index: 20; font-size: 13px; font-weight: 600; letter-spacing: .32em; }
  .brand b { color: #b38cff; font-weight: 600; }
  #shade { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1s ease;
           background: linear-gradient(90deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.78) 26%, rgba(0,0,0,.25) 46%, rgba(0,0,0,0) 56%); }
  body.focused.arrived #shade { opacity: 1; transition-duration: .8s; }
  .tag { position: fixed; transform: translateX(-50%); z-index: 6; pointer-events: none; white-space: normal; text-align: center; line-height: 1.5;
         font-size: 9.5px; letter-spacing: .16em; color: #c9c1d6; text-transform: uppercase; transition: opacity .4s; }
  body.focused .tag { opacity: 0 !important; }
  #panel { position: fixed; z-index: 10; left: 7vw; top: 50%; width: min(440px, 38vw); transform: translate(-20px, -50%);
           opacity: 0; transition: opacity .5s ease, transform .5s ease; pointer-events: none; }
  body.focused.arrived #panel { opacity: 1; transform: translate(0, -50%); pointer-events: auto; transition-duration: .8s; }
  #panel .line { font-size: 11px; font-weight: 500; letter-spacing: .3em; color: #b38cff; margin-bottom: 16px; }
  #panel h1 { font-size: clamp(36px, 4.4vw, 64px); font-weight: 800; line-height: 1; letter-spacing: -.01em; }
  #panel h2 { margin-top: 14px; font-size: 13px; font-weight: 400; letter-spacing: .22em; color: #bdb5cb; text-transform: uppercase; }
  #panel .tagline { margin-top: 30px; font-size: 14px; font-weight: 600; letter-spacing: .12em; }
  #panel p { margin-top: 14px; font: 400 14px/1.8 "Noto Sans KR", sans-serif; color: #d9d3e3; white-space: pre-line; }
  #panel .more { display: inline-flex; align-items: center; gap: 10px; margin-top: 26px; padding: 12px 26px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: #f4f2f7; font: 500 13px "Noto Sans KR", sans-serif; text-decoration: none; letter-spacing: .04em; transition: background .25s, border-color .25s; }
  #panel .more:hover { background: rgba(179,140,255,.18); border-color: rgba(179,140,255,.6); }
  #panel .more span { transition: transform .25s; } #panel .more:hover span { transform: translateX(4px); }
  #panel dl { margin-top: 26px; display: grid; grid-template-columns: 72px 1fr; gap: 9px 14px; font: 400 13px "Noto Sans KR", sans-serif; }
  #panel dt { color: #8d84a0; } #panel dd { color: #ece8f2; }
  .btn { font: inherit; color: #f4f2f7; background: rgba(12,11,14,.6); border: 1px solid rgba(255,255,255,.22); cursor: pointer;
         backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .btn:hover { background: rgba(255,255,255,.1); }
  #back { position: fixed; top: 22px; right: 28px; z-index: 20; border-radius: 999px; padding: 9px 18px; font-size: 13px; }
  #nav { position: fixed; right: 28px; bottom: 26px; z-index: 20; display: flex; gap: 8px; }
  #nav .btn { width: 42px; height: 42px; border-radius: 50%; font-size: 18px; }
  #back, #nav { opacity: 0; pointer-events: none; transition: opacity .4s; }
  body.focused #back, body.focused #nav { opacity: 1; pointer-events: auto; }
  #hint { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 20; font-size: 12px; color: #a59cb6; transition: opacity .5s; white-space: nowrap; }
  body.focused #hint { opacity: 0; }
  @media (max-width: 760px) {
    .brand { top: 22px; left: 22px; font-size: 12px; } .tag { display: none; }
    #shade { background: linear-gradient(180deg, rgba(0,0,0,0) 61%, rgba(0,0,0,.85) 70%, #000 80%); }   /* starts below the niche */
    #panel { left: 0; right: 0; top: auto; bottom: 0; width: auto; transform: translateY(24px); padding: 0 26px calc(30px + env(safe-area-inset-bottom)); }
    body.focused.arrived #panel { transform: translateY(0); }
    #panel h1 { font-size: 38px; } #panel .tagline { margin-top: 16px; font-size: 13px; } #panel dl { display: none; } #panel p { font-size: 12.5px; line-height: 1.65; margin-top: 10px; } #panel .more { margin-top: 14px; padding: 9px 20px; font-size: 12px; } #panel h2 { margin-top: 8px; } #panel .line { margin-bottom: 8px; }
    #back { top: 16px; right: 16px; padding: 8px 14px; font-size: 12px; }
    #nav { left: 12px; right: 12px; bottom: auto; top: 30%; justify-content: space-between; }
  }
</style>
</head>
<body>

  cv.style.cursor = i >= 0 ? 'pointer' : 'default';
});
cv.addEventListener('pointerleave', () => { if (focus < 0) { hover = -1; setGoals(); dirty = true; } });
cv.addEventListener('click', e => {
  if (anim) return;
  const i = niche(e);
  if (focus < 0) { if (i >= 0) open(i); } else if (i !== focus) close();
});
$('back').onclick = close;
$('prev').onclick = () => open((focus + S.prods.length - 1) % S.prods.length);
$('next').onclick = () => open((focus + 1) % S.prods.length);
addEventListener('keydown', e => {
  if (focus < 0) return;
  if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') $('next').click(); if (e.key === 'ArrowLeft') $('prev').click();
});
addEventListener('resize', () => { const m = isMobile() ? 'm' : 'pc'; if (A[m] && S.id !== m) { start(m); return; }
  const tv = focus >= 0 ? focusView(focus) : overviewView();
  if (anim) anim.target = tv; else view = tv; dirty = true; });

async function start(id) {
  if (!A[id]) id = 'pc';
  const a = A[id];
  if (!lv[id]) lv[id] = await mips(await load(a.base), 900);
  document.querySelectorAll('.tag').forEach(t => t.remove());
  S = { id, res: a.res, prods: a.prods.map(p => ({ ...p })) };
  await Promise.all(S.prods.map(async p => { p.L = await Promise.all(p.layers.map(async l => ({ crop: l.crop, hi: l.hi, img: await mips(await load(l.src), 160) }))); }));
  S.prods.forEach(p => { const t = document.createElement('div'); t.className = 'tag'; t.textContent = INFO[p.key].name; document.body.appendChild(t); p.tagEl = t; });
  focus = -1; hover = -1; document.body.classList.remove('focused', 'arrived'); setGoals();
  $('hint').textContent = isMobile() ? '제품을 탭해서 자세히 보기' : '제품에 마우스를 올리거나 클릭해 보세요';
  view = overviewView(); dirty = true; draw(); if (window.cfBootDone) window.cfBootDone();
}
start(isMobile() ? 'm' : 'pc').then(() => { requestAnimationFrame(tick);
  const f = location.hash.match(/f=(\d)/); if (f) setTimeout(() => open(+f[1]), 400); });
