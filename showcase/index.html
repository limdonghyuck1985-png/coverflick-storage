  const x0 = view.cx - W / 2 / view.s, y0 = view.cy - H / 2 / view.s;
  { // Safari draws nothing when the source rectangle leaves the image, so clip it to the image first
    const sx = x0 * f, sy = y0 * f, sw = W / view.s * f, sh = H / view.s * f;
    const ax = Math.max(0, sx), ay = Math.max(0, sy), bx = Math.min(img.width, sx + sw), by = Math.min(img.height, sy + sh);
    if (bx > ax && by > ay) ctx.drawImage(img, ax, ay, bx - ax, by - ay, (ax - sx) / sw * W, (ay - sy) / sh * H, (bx - ax) / sw * W, (by - ay) / sh * H);
  }
  // hovered / selected niche: same scene re-rendered with that niche's downlight brighter (wall, product, floor reflection together)
  const put = (levels, r, a) => {
    const w = (r[2] - r[0]) * S.res[0] * view.s, h = (r[3] - r[1]) * S.res[1] * view.s;
    let k = 0; while (k + 1 < levels.length && levels[k + 1].width >= w * dpr * 1.05) k++;
    ctx.globalAlpha = a; ctx.drawImage(levels[k], (r[0] * S.res[0] - x0) * view.s, (r[1] * S.res[1] - y0) * view.s, w, h); ctx.globalAlpha = 1;
  };
  for (const p of S.prods) {
    const a = alpha[p.key] || 0; if (a < .003 || !p.L) continue;
    for (const l of p.L) {
      let la = a;
      if (l.hi) {   // sharper copy of the small niches, faded in only once it is shown larger than the strip resolution
        const pxPerUnit = view.s * dpr; la *= Math.min(1, Math.max(0, (pxPerUnit - .8) / .4));
      }
      if (la > .003) put(l.img, l.crop, la);
    }
  }
  // product name tags under each niche (overview only)
  S.prods.forEach((p, i) => {
    const r = p.rect, t = p.tagEl; if (!t) return;
    t.style.left = ((r[0] + r[2]) / 2 * S.res[0] - x0) * view.s + 'px';
    t.style.top = ((r[3]) * S.res[1] - y0) * view.s + 16 + 'px';
    t.style.opacity = hover === i ? 1 : .55;
  });
}
function tick(now) {
  if (anim) {
    const t = Math.min(1, Math.max(0, (now - anim.t0) / anim.dur)), e = ease(t), a = anim.from, b = anim.target;
    if (anim.swap) {   // one niche's light dims while the next one comes up, in step with the camera
      const sm = (x0, x1, x) => { const u = Math.min(1, Math.max(0, (x - x0) / (x1 - x0))); return u * u * (3 - 2 * u); };
      alpha[anim.swap[0]] = 1 - sm(0, .55, t); alpha[anim.swap[1]] = sm(.35, 1, t);
    }
    const ls = Math.log(a.s) + (Math.log(b.s) - Math.log(a.s)) * e;
    const s = Math.exp(ls), k = anim.anchor;
    if (k) {
      const W2 = innerWidth / 2, H2 = innerHeight / 2;
      const p0x = (k.x - a.cx) * a.s + W2, p0y = (k.y - a.cy) * a.s + H2, p1x = (k.x - b.cx) * b.s + W2, p1y = (k.y - b.cy) * b.s + H2;
      const px = p0x + (p1x - p0x) * e, py = p0y + (p1y - p0y) * e;
      view = { s, cx: k.x - (px - W2) / s, cy: k.y - (py - H2) / s };
    } else view = { s, cx: a.cx + (b.cx - a.cx) * e, cy: a.cy + (b.cy - a.cy) * e };
    if (t >= 1) { const was = anim; anim = null; if (focus >= 0) document.body.classList.add('arrived');
      if (was.swap) { alpha[was.swap[0]] = 0; alpha[was.swap[1]] = 1; }
      if (closing >= 0) { closing = -1; setGoals(); } }
    dirty = true;
  }
  const dt = Math.min(.1, (now - (tick.last || now)) / 1000) / SLOW; tick.last = now;
  for (const p of S.prods) {
    if (anim && anim.swap && anim.swap.includes(p.key)) continue;
    const g = alphaGoal[p.key] || 0, c = alpha[p.key] || 0;
    if (Math.abs(g - c) > .002) { alpha[p.key] = c + (g - c) * (1 - Math.exp(-dt / .14)); dirty = true; } else alpha[p.key] = g;
  }
  if (dirty) { draw(); dirty = false; }
  requestAnimationFrame(tick);
}

// ---------- interaction ----------
function niche(e) {
  const x0 = view.cx - innerWidth / 2 / view.s, y0 = view.cy - innerHeight / 2 / view.s;
  const ix = (x0 + e.clientX / view.s) / S.res[0], iy = (y0 + e.clientY / view.s) / S.res[1];
  return S.prods.findIndex(p => ix >= p.rect[0] && ix <= p.rect[2] && iy >= p.rect[1] && iy <= p.rect[3]);
}
let closing = -1;
function setGoals() {
  S.prods.forEach((p, i) => alphaGoal[p.key] = (focus >= 0 ? i === focus : (i === hover || i === closing)) ? HOVER_A : 0);
}
function fill(p) {
  const d = INFO[p.key];
  $('p-line').textContent = d.line; $('p-name').textContent = d.name; $('p-sub').textContent = d.sub;
  $('p-tag').textContent = d.tag; $('p-desc').textContent = COPY[p.key].desc; $('p-more').href = COPY[p.key].url;
  $('p-spec').innerHTML = `<dt>용량</dt><dd>${d.vol}</dd><dt>구분</dt><dd>${d.type}</dd>`;
}
function open(i) {
  const was = focus; focus = i; hover = -1; fill(S.prods[i]);
  document.body.classList.add('focused'); document.body.classList.remove('arrived');
  setGoals();
  if (was >= 0 && was !== i) go(focusView(i), 1100, null, 0, [S.prods[was].key, S.prods[i].key]);
  else { const lit = (alpha[S.prods[i].key] || 0) > .9;            // phone (no hover): light comes up first, then the camera moves
    go(focusView(i), 1600, nicheCentre(i), lit ? 0 : 420); } cv.style.cursor = 'default';
}
function close() {
  const k = focus >= 0 ? nicheCentre(focus) : null; closing = focus; focus = -1; document.body.classList.remove('focused', 'arrived'); setGoals(); go(overviewView(), 1400, k);
}
cv.addEventListener('pointermove', e => {
  if (focus >= 0 || anim) return;
  const i = niche(e); if (i !== hover) { hover = i; setGoals(); dirty = true; }
  cv.style.cursor = i >= 0 ? 'pointer' : 'default';
});
cv.addEventListener('pointerleave', () => { if (focus < 0) { hover = -1; setGoals(); dirty = true; } });
cv.addEventListener('click', e => {
  if (anim) return;
  const i = niche(e);
  if (focus < 0) { if (i >= 0) open(i); } else if (i !== focus) close();
});
$('back').onclick = close;
$('prev').onclick = () => open((focus + S.prods.length - 1) % S.prods.length);
$('next').onclick = () => open((focus + 1) % S.prods.length);
addEventListener('keydown', e => {
  if (focus < 0) return;
  if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') $('next').click(); if (e.key === 'ArrowLeft') $('prev').click();
});
addEventListener('resize', () => { const m = isMobile() ? 'm' : 'pc'; if (A[m] && S.id !== m) { start(m); return; }
  const tv = focus >= 0 ? focusView(focus) : overviewView();
  if (anim) anim.target = tv; else view = tv; dirty = true; });

async function start(id) {
  if (!A[id]) id = 'pc';
  const a = A[id];
  if (!lv[id]) lv[id] = await mips(await load(a.base), 900);
  document.querySelectorAll('.tag').forEach(t => t.remove());
  S = { id, res: a.res, prods: a.prods.map(p => ({ ...p })) };
  await Promise.all(S.prods.map(async p => { p.L = await Promise.all(p.layers.map(async l => ({ crop: l.crop, hi: l.hi, img: await mips(await load(l.src), 160) }))); }));
  S.prods.forEach(p => { const t = document.createElement('div'); t.className = 'tag'; t.textContent = INFO[p.key].name; document.body.appendChild(t); p.tagEl = t; });
  focus = -1; hover = -1; document.body.classList.remove('focused', 'arrived'); setGoals();
  $('hint').textContent = isMobile() ? '제품을 탭해서 자세히 보기' : '제품에 마우스를 올리거나 클릭해 보세요';
  view = overviewView(); dirty = true; $('loading').classList.add('done');
}
start(isMobile() ? 'm' : 'pc').then(() => { requestAnimationFrame(tick);
  const f = location.hash.match(/f=(\d)/); if (f) setTimeout(() => open(+f[1]), 400); });
</script>
